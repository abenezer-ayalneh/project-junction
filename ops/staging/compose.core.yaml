name: project-junction-staging

# Bring up isolated state services before external provider credentials exist.
# Keep these service definitions identical to compose.yaml so full deployment
# reuses their volumes and credentials.
services:
    postgres:
        image: ${STAGING_POSTGRES_IMAGE:?}
        restart: unless-stopped
        cpus: ${STAGING_POSTGRES_CPUS:?}
        mem_limit: ${STAGING_POSTGRES_MEMORY:?}
        pids_limit: 256
        environment:
            POSTGRES_DB: ${STAGING_DB_NAME:?}
            POSTGRES_USER: ${STAGING_DB_USER:?}
            POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
        secrets:
            - { source: postgres_password, target: POSTGRES_PASSWORD }
        volumes:
            - postgres18_data:/var/lib/postgresql
        networks: [backend]
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" && psql -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}" -Atqc "SELECT uuidv7() IS NOT NULL AND postgis_version() IS NOT NULL" | grep -qx t',
                ]
            interval: 5s
            timeout: 3s
            retries: 20

    redis:
        image: ${STAGING_REDIS_IMAGE:?}
        restart: unless-stopped
        cpus: ${STAGING_REDIS_CPUS:?}
        mem_limit: ${STAGING_REDIS_MEMORY:?}
        pids_limit: 128
        command: ['redis-server', '--aclfile', '/run/secrets/redis_acl', '--appendonly', 'yes', '--appendfsync', 'always']
        secrets:
            - { source: redis_acl, target: redis_acl }
        volumes:
            - redis_data:/data
        networks: [backend]

    clamav:
        image: ${STAGING_CLAMAV_IMAGE:?}
        restart: unless-stopped
        cpus: ${STAGING_CLAMAV_CPUS:?}
        mem_limit: ${STAGING_CLAMAV_MEMORY:?}
        pids_limit: 256
        volumes:
            - clamav_data:/var/lib/clamav
        networks: [backend, egress]

    minio:
        image: ${STAGING_MINIO_IMAGE:?}
        restart: unless-stopped
        cpus: ${STAGING_MINIO_CPUS:?}
        mem_limit: ${STAGING_MINIO_MEMORY:?}
        pids_limit: 256
        command: ['server', '/data', '--console-address', ':9001']
        environment:
            MINIO_ROOT_USER_FILE: /run/secrets/MINIO_ROOT_USER
            MINIO_ROOT_PASSWORD_FILE: /run/secrets/MINIO_ROOT_PASSWORD
        secrets:
            - { source: minio_root_user, target: MINIO_ROOT_USER }
            - { source: minio_root_password, target: MINIO_ROOT_PASSWORD }
        volumes:
            - minio_data:/data
        ports:
            - 127.0.0.1:${STAGING_MINIO_HOST_PORT:?}:9000
        networks: [backend]

secrets:
    postgres_password: { file: '${STAGING_POSTGRES_PASSWORD_FILE:?}' }
    redis_acl: { file: '${STAGING_REDIS_ACL_FILE:?}' }
    minio_root_user: { file: '${STAGING_MINIO_ROOT_USER_FILE:?}' }
    minio_root_password: { file: '${STAGING_MINIO_ROOT_PASSWORD_FILE:?}' }

volumes:
    postgres18_data:
    redis_data:
    clamav_data:
    minio_data:

networks:
    backend:
        internal: true
    egress:
