name: project-junction-local

services:
    postgres:
        image: postgis/postgis:18-3.6
        platform: linux/amd64
        environment:
            POSTGRES_DB: junction
            POSTGRES_USER: junction
            POSTGRES_PASSWORD: junction
        ports:
            - '127.0.0.1:${JUNCTION_POSTGRES_PORT:-55432}:5432'
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U junction -d junction']
            interval: 5s
            timeout: 3s
            retries: 20
        volumes:
            - junction_postgres:/var/lib/postgresql

    redis:
        image: redis:8-alpine
        ports:
            - '127.0.0.1:6379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 20
        volumes:
            - junction_redis:/data

    meilisearch:
        image: getmeili/meilisearch:v1.16
        environment:
            MEILI_MASTER_KEY: synthetic-local-key-only
            MEILI_ENV: development
        ports:
            - '127.0.0.1:7700:7700'
        volumes:
            - junction_meilisearch:/meili_data

    mailpit:
        image: axllent/mailpit:v1.28
        ports:
            - '127.0.0.1:8025:8025'
            - '127.0.0.1:1025:1025'

    minio:
        image: minio/minio:latest
        command: server /data --console-address ':9001'
        environment:
            MINIO_ROOT_USER: junction-local
            MINIO_ROOT_PASSWORD: junction-local-secret
            MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:3000,http://localhost:3000
        ports:
            - '127.0.0.1:59000:9000'
            - '127.0.0.1:59001:9001'
        volumes:
            - junction_minio:/data

    minio-init:
        image: minio/minio:latest
        depends_on:
            minio:
                condition: service_started
        entrypoint: /bin/sh
        command:
            - -ec
            - |
                until mc alias set junction http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do sleep 1; done
                mc mb --ignore-existing junction/"$$MINIO_BUCKET"
        environment:
            MINIO_BUCKET: junction-media-local
            MINIO_ROOT_USER: junction-local
            MINIO_ROOT_PASSWORD: junction-local-secret
        restart: 'no'

    clamav:
        image: clamav/clamav:stable
        platform: linux/amd64
        ports:
            - '127.0.0.1:13310:3310'
        volumes:
            - junction_clamav:/var/lib/clamav

volumes:
    junction_postgres:
    junction_meilisearch:
    junction_minio:
    junction_clamav:
    junction_redis:
